[package]
name = "ximi-ultimate-tool"
version = "1.0.0"
description = "Xiaomi HyperOS & MIUI ADB and Fastboot Swiss Army Knife in Rust"
authors = ["iprjkt"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ximi_ultimate_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.6" }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
regex = "1.10"
which = "6.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
open = "5.3"
